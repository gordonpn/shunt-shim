name: DeepSeek Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: runner / deepseek-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event.sender.type != 'Bot' &&
      github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
         contains(github.event.comment.body, '/review')))
    env:
      REVIEW_GATEWAY_TOKEN: ${{ secrets.REVIEW_GATEWAY_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout repository
        if: env.REVIEW_GATEWAY_TOKEN != '' || env.DEEPSEEK_API_KEY != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Load DeepSeek review prompt
        id: load-prompt
        if: env.REVIEW_GATEWAY_TOKEN != '' || env.DEEPSEEK_API_KEY != ''
        run: ./.github/scripts/write-deepseek-review-prompt.sh .github/prompts/deepseek-review.md

      - name: DeepSeek Code Review
        if: env.REVIEW_GATEWAY_TOKEN != '' || env.DEEPSEEK_API_KEY != ''
        uses: hustcer/deepseek-review@eccde2e9781008d795e366b951e313e37af88dd5 # v1
        with:
          base-url: ${{ env.REVIEW_GATEWAY_TOKEN != '' && 'https://shunt-shim.gordon-pn.com/v1' || 'https://api.deepseek.com' }}
          model: ${{ env.REVIEW_GATEWAY_TOKEN != '' && 'fast' || 'deepseek-v4-flash' }}
          chat-token: ${{ env.REVIEW_GATEWAY_TOKEN || secrets.DEEPSEEK_API_KEY }}
          sys-prompt: ${{ steps.load-prompt.outputs.prompt }}
          watch-mention: '/review'
