name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  project:
    name: runner / project prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.files.outputs.node }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Detect pnpm project
        id: files
        run: echo "node=${{ hashFiles('package.json') != '' && hashFiles('pnpm-lock.yaml') != '' }}" >> "$GITHUB_OUTPUT"

  workflows:
    name: runner / workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup verification tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.3
      - name: Check workflows and reporting script
        run: just check-workflows

  test:
    name: runner / test
    needs: project
    if: needs.project.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Setup verification tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.10.3
      - name: Install dependencies
        run: just install-ci
      - name: Typecheck
        run: just typecheck
      - name: Run unit tests
        run: just test
